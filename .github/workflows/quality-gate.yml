name: Quality gate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: atlas_test
          POSTGRES_USER: atlas_test
          POSTGRES_PASSWORD: atlas_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas_test -d atlas_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      NODE_ENV: test
      ATLAS_ENV: ci
      DATABASE_URL: postgresql://atlas_test:atlas_test_only@localhost:5432/atlas_test
      WEB_ORIGIN: http://localhost:5173
      VITE_API_BASE_URL: http://localhost:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint GitHub workflows
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/repo:ro"
          --workdir /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color

      - name: Set up pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.20.0
          runtime: node@24.19.0
          cache: true
          install: false

      - name: Scan source for tracked secrets
        run: pnpm security:secrets

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit workspace dependencies
        run: pnpm security:dependencies

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Verify repository
        run: pnpm verify

      - name: Build production artifacts
        run: pnpm build

      - name: Build production container images
        run: pnpm containers:build

      - name: Scan production container images
        run: pnpm security:containers

  e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.20.0
          runtime: node@24.19.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @atlas/e2e exec playwright install --with-deps chromium

      - name: Run browser system tests
        run: pnpm test:e2e
