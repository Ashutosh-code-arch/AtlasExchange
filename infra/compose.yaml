name: atlas-exchange

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_local_only
    ports:
      - "${ATLAS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - atlas-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.30.6
    ports:
      - "${ATLAS_MAILPIT_SMTP_PORT:-1025}:1025"
      - "${ATLAS_MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  atlas-postgres-data:
