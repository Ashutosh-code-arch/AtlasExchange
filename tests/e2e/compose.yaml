name: atlas-e2e

services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: ${ATLAS_E2E_DATABASE_NAME:?ATLAS_E2E_DATABASE_NAME is required}
      POSTGRES_USER: atlas_e2e
      POSTGRES_PASSWORD: atlas_e2e_only
    ports:
      - "${ATLAS_E2E_POSTGRES_PORT:?ATLAS_E2E_POSTGRES_PORT is required}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U atlas_e2e -d ${ATLAS_E2E_DATABASE_NAME:?ATLAS_E2E_DATABASE_NAME is required}",
        ]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 3s

  mailpit:
    image: axllent/mailpit:v1.30.6
    ports:
      - "${ATLAS_E2E_MAILPIT_SMTP_PORT:?ATLAS_E2E_MAILPIT_SMTP_PORT is required}:1025"
      - "${ATLAS_E2E_MAILPIT_HTTP_PORT:?ATLAS_E2E_MAILPIT_HTTP_PORT is required}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 2s
