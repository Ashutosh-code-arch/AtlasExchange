packages:
  - "apps/*"
  - "packages/*"
  - "tests/e2e"

allowBuilds:
  argon2: true
  esbuild: true

enableGlobalVirtualStore: false
managePackageManagerVersions: false
confirmModulesPurge: false

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@oxc-project/types"
  - "@rolldown/*"
  - "electron-to-chromium"
  - "rolldown"
